<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rumaisha Shop - Inventory Emas</title>
    <script>
      (function() {
        try {
          const property = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (property && !property.writable && !property.set && property.configurable) {
            const originalFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get() { return originalFetch; },
              set() { console.warn('Something tried to override fetch, update blocked.'); },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
